# security_audit_plan F-12 / I-18 — automated dependency and action updates.
# Grouped so a week's worth of patch bumps is one PR, not twenty.
# 🔴 These PRs do NOT run CI (`ci.yml` skips `dependabot/*` branches, to save
# Actions minutes): check a bump with `npm run ci` locally before merging, or run
# the CI workflow by hand from the Actions tab.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
