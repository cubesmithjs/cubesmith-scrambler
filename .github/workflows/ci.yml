name: CI

on:
  push:
    branches: [main]
  pull_request:

# 🔴 Least privilege for GITHUB_TOKEN (security_audit_plan F-12): a compromised
# third-party action running in a PR job must not be able to write to the repo.
# A job that needs more declares it on the job.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false` keeps GITHUB_TOKEN out of the checkout, where
      # every install script `npm ci` runs could otherwise read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
