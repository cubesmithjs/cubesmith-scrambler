name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab, on any branch — including a Dependabot one,
  # which the job below otherwise skips.
  workflow_dispatch:

# 🔴 Least privilege for GITHUB_TOKEN (security_audit_plan F-12): a compromised
# third-party action running in a PR job must not be able to write to the repo.
# A job that needs more declares it on the job.
permissions:
  contents: read

jobs:
  test:
    # 🔴 Dependabot pull requests do not run CI, to save the account's monthly
    # Actions minutes (owner decision, 2026-10-21). The branch name is the test,
    # not the actor, so a human pushing a fix onto a Dependabot branch is skipped
    # too. A skipped job counts as passing for a required status check, so the PR
    # stays mergeable. Prove a bump with `npm run ci` locally (or run this
    # workflow by hand); `main` is tested again on merge, and the publish job
    # runs the whole suite before anything reaches npm.
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false` keeps GITHUB_TOKEN out of the checkout, where
      # every install script `npm ci` runs could otherwise read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
