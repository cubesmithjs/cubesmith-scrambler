name: CI

on:
  push:
    branches: [main]
  pull_request:

# 🔴 Least privilege for GITHUB_TOKEN (security_audit_plan F-12): a compromised
# third-party action running in a PR job must not be able to write to the repo.
# A job that needs more declares it on the job.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
